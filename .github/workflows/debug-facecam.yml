name: debug-facecam
on: workflow_dispatch
permissions:
  contents: write
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: |
          which ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
          pip install -q streamlink numpy "opencv-python-headless<5"
          mkdir -p dbg && cd dbg
          curl -sL -o face.xml https://raw.githubusercontent.com/opencv/opencv/4.x/data/haarcascades/haarcascade_frontalface_default.xml
          curl -sL -o yunet.onnx https://github.com/opencv/opencv_zoo/raw/main/models/face_detection_yunet/face_detection_yunet_2023mar.onnx
          ls -la
          python3 - <<'PY'
          import sys; sys.path.insert(0, "..")
          import json, subprocess, cv2, numpy as np
          sys.argv=["x"]
          import importlib.util
          spec = importlib.util.spec_from_file_location("r", "../clipforge/run.py"); r = importlib.util.module_from_spec(spec); spec.loader.exec_module(r)
          lives = r.english_gta_lives(12)[:8]
          out = []
          casc = cv2.CascadeClassifier("face.xml")
          yn = cv2.FaceDetectorYN.create("yunet.onnx", "", (960, 540), 0.6, 0.3, 50)
          for l in lives:
              ts = f"{l['login']}.ts"
              subprocess.run(["streamlink", "--twitch-disable-ads", "--hls-duration", "6", "-f", "-o", ts, f"https://www.twitch.tv/{l['login']}", "720p60,720p,best"], capture_output=True, timeout=120)
              subprocess.run(["ffmpeg", "-v", "error", "-y", "-ss", "3", "-i", ts, "-frames:v", "1", "-vf", "scale=960:540", f"{l['login']}.jpg"])
              img = cv2.imread(f"{l['login']}.jpg")
              if img is None: continue
              g = cv2.cvtColor(img, cv2.COLOR_BGR2GRAY)
              haar = [list(map(int, f)) for f in casc.detectMultiScale(g, 1.1, 6, minSize=(36, 36))]
              haar3 = [list(map(int, f)) for f in casc.detectMultiScale(g, 1.08, 3, minSize=(24, 24))]
              _, faces = yn.detect(img)
              yun = [[int(v) for v in f[:4]] + [round(float(f[-1]), 2)] for f in (faces if faces is not None else [])]
              out.append({"login": l["login"], "haar6": haar, "haar3": haar3, "yunet": yun})
              print(l["login"], "haar6", haar, "haar3", haar3, "yunet", yun)
          json.dump(out, open("result.json", "w"), indent=1)
          PY
          rm -f *.ts face.xml yunet.onnx
          git config user.name dbg; git config user.email dbg@users.noreply.github.com
          git init -q -b debug && git add -A && git commit -q -m dbg && git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" debug
