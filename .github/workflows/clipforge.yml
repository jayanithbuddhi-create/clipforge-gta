name: ClipForge GTA

on:
  schedule:
    - cron: "7,27,47 * * * *"   # ogni 20 minuti
  issues:
    types: [opened]               # comando dal telefono: "Clippa" nella galleria apre una richiesta gia' compilata
  workflow_dispatch:
    inputs:
      link:
        description: "Link Twitch da clippare (live o VOD). Vuoto = gli agenti scelgono da soli"
        required: false
        default: ""
      stile:
        description: "Stile: hype, funny, action, drama"
        required: false
        default: ""
      minuti:
        description: "Minuti da registrare"
        required: false
        default: "10"
      facecam:
        description: "Facecam: auto, tl, tr, bl, br, none"
        required: false
        default: ""
      da:
        description: "Solo VOD: parti dal minuto"
        required: false
        default: "0"
      solo_scout:
        description: "1 = aggiorna solo la lista delle live"
        required: false
        default: "0"

permissions:
  contents: write
  issues: write

concurrency:
  group: clipforge
  cancel-in-progress: false

env:
  LINK: ${{ github.event.inputs.link }}
  STILE: ${{ github.event.inputs.stile }}
  MINUTI: ${{ github.event.inputs.minuti }}
  FACECAM: ${{ github.event.inputs.facecam }}
  DA: ${{ github.event.inputs.da }}
  SOLO_SCOUT: ${{ github.event.inputs.solo_scout }}
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  agenti:
    # le richieste valgono solo se le apre il proprietario del progetto e iniziano con "ClipForge"
    if: github.event_name != 'issues' || (github.event.issue.user.login == github.repository_owner && startsWith(github.event.issue.title, 'ClipForge'))
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4

      - name: "Comando dal telefono"
        if: github.event_name == 'issues'
        run: |
          python3 - <<'PY'
          import json, os, re
          ev = json.load(open(os.environ["GITHUB_EVENT_PATH"]))
          body = (ev["issue"].get("body") or "")
          keys = {"link": "CMD_LINK", "stile": "CMD_STILE", "minuti": "CMD_MINUTI", "facecam": "CMD_FACECAM", "solo_scout": "CMD_SOLO_SCOUT"}
          with open(os.environ["GITHUB_ENV"], "a") as f:
              for line in body.splitlines():
                  m = re.match(r"\s*(\w+)\s*:\s*(\S+)\s*$", line)
                  if m and m.group(1).lower() in keys and re.fullmatch(r"[A-Za-z0-9_:/.@\-]{1,120}", m.group(2)):
                      f.write(f"{keys[m.group(1).lower()]}={m.group(2)}\n")
          PY
          gh issue comment ${{ github.event.issue.number }} --body "Ricevuto: gli agenti sono partiti. Le clip arrivano nella galleria tra circa 15 minuti." -R ${{ github.repository }} || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-base-en-v1

      - name: "Preparazione"
        run: |
          which ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
          pip install -q -r requirements.txt
          mkdir -p _models && curl -sL -o _models/yunet.onnx https://github.com/opencv/opencv_zoo/raw/main/models/face_detection_yunet/face_detection_yunet_2023mar.onnx
          echo "YUNET_ONNX=$PWD/_models/yunet.onnx" >> $GITHUB_ENV

      - name: "Scout · cerca le live GTA in inglese"
        run: python clipforge/run.py scout

      - name: "Hunter · registra la live"
        if: env.SOLO_SCOUT != '1' && env.CMD_SOLO_SCOUT != '1'
        run: python clipforge/run.py record

      - name: "Hunter · analizza hype e facecam"
        if: env.SOLO_SCOUT != '1' && env.CMD_SOLO_SCOUT != '1'
        run: python clipforge/run.py analyze

      - name: "Judge + Editor · sceglie e monta le clip"
        if: env.SOLO_SCOUT != '1' && env.CMD_SOLO_SCOUT != '1'
        run: python clipforge/run.py edit

      - name: "Pubblica · galleria"
        if: env.SOLO_SCOUT != '1' && env.CMD_SOLO_SCOUT != '1'
        run: python clipforge/run.py publish

      - name: "Chiude la richiesta"
        if: always() && github.event_name == 'issues'
        run: gh issue close ${{ github.event.issue.number }} -R ${{ github.repository }} --comment "Fatto ✅ Apri la galleria per vedere le clip." || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
