name: debug
on: workflow_dispatch
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - run: |
          python3 - <<'EOF'
          import json, urllib.request
          def q(query, v={}):
              req = urllib.request.Request("https://gql.twitch.tv/gql", data=json.dumps({"query":query,"variables":v}).encode(),
                    headers={"Client-ID":"kimne78kx3ncx6brgo4mv6wki5h1ko","Content-Type":"application/json"})
              try:
                  return json.loads(urllib.request.urlopen(req, timeout=20).read())
              except Exception as e:
                  return {"exc": str(e)}
          node = "node{title viewersCount language previewImageURL(width:440,height:248) broadcaster{login displayName broadcastSettings{language}} freeformTags{name}}"
          for opt in ['options:{languages:[EN]}', 'options:{broadcasterLanguages:[EN]}', 'options:{sort:VIEWER_COUNT}', '']:
              a = f"({opt}, first:5)" if opt else "(first:5)"
              r = q('{game(name:"Grand Theft Auto V"){streams%s{edges{%s}}}}' % (a, node))
              print("=== ", opt); print(json.dumps(r)[:1500])
          r = q('{game(name:"Grand Theft Auto V"){streams(first:5){edges{node{title viewersCount broadcaster{login broadcastSettings{language}}}}}}}')
          print("=== minimal"); print(json.dumps(r)[:1500])
          EOF
          pip -q install faster-whisper && python3 -c "import faster_whisper;print('fw ok')"
          ffmpeg -hide_banner -filters | grep -E "zoompan|ass|subtitles|drawtext"; ffmpeg -version | head -1
